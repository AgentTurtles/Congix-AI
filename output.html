<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COGNIX - AI Guidance</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 450px;
      height: 600px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <!-- Background image -->
    <div class="auth-background-image">
      <img src="https://www.figma.com/api/mcp/asset/191ca648-4eb9-4686-82c8-edc4b0db41d1" alt="Background">
    </div>
    
    <!-- Overlay -->
    <div class="auth-overlay"></div>
    
    <!-- Top left icon -->
    <div class="auth-top-icon">
      <img src="https://www.figma.com/api/mcp/asset/0f8eb173-f5ae-473e-a7f0-be669b656220" alt="Icon">
    </div>
    
    <!-- Hamburger menu -->
    <button class="auth-hamburger-btn" id="hamburgerMenu" aria-label="Menu">
      <div class="auth-hamburger" style="top: 8px;"></div>
      <div class="auth-hamburger" style="top: 14px;"></div>
      <div class="auth-hamburger" style="top: 20px;"></div>
    </button>
    
    <!-- Navigation menu -->
    <div class="auth-nav-menu" id="navMenu">
      <a href="student-dashboard.html" class="nav-menu-item">Dashboard</a>
      <a href="#" class="nav-menu-item" id="aboutLink">About</a>
      <a href="#" class="nav-menu-item" id="helpLink">Help</a>
      <div class="nav-menu-divider"></div>
      <a href="#" class="nav-menu-item" id="logoutLink">Logout</a>
    </div>
    
    <!-- COGNIX Title -->
    <h1 class="auth-student-title">COGNIX</h1>
    
    <!-- AI Guidance Title -->
    <p class="student-help-title">AI Guidance</p>
    
    <!-- Output container -->
    <div class="student-output-container">
      <div id="guidanceOutput" class="student-output-content"></div>
    </div>
    
    <!-- Back button -->
    <button class="auth-submit-btn student-submit-btn" id="backToDashboard" style="top: 520px;">
      <span>← Back to Dashboard</span>
    </button>
  </div>
  
  <script src="auth.js"></script>
  <script src="output.js"></script>
</body>
</html>
